  <text x="330" y="48" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="900" fill="#1b4332">green AI, the way I practice it</text>
  <circle cx="340" cy="80" r="12" fill="#2a9d8f"/><text x="340" y="85" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#fff">1</text><text x="362" y="86" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b4332">smallest model that does the job</text><circle cx="340" cy="116" r="12" fill="#8ab17d"/><text x="340" y="121" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#fff">2</text><text x="362" y="122" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b4332">meter every token (AI budgets per business)</text><circle cx="340" cy="152" r="12" fill="#e9c46a"/><text x="340" y="157" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#fff">3</text><text x="362" y="158" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b4332">self-host when it can (whisper, CI runners)</text><circle cx="340" cy="188" r="12" fill="#f4a261"/><text x="340" y="193" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#fff">4</text><text x="362" y="194" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b4332">fewer machines: one Postgres, no Redis</text>
