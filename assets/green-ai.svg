  <rect x="744" y="194" width="20" height="14" rx="7" fill="#52b788"><animate attributeName="width" values="20;40;20" dur="4s" repeatCount="indefinite"/></rect>
  <text x="800" y="232" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11" fill="#2d6a4f">watts well spent</text>
